api_key = "sk-kimi-uVbo2OFv14bWYQsFgZveTNq40l8r83HpoTgZyH9z5AUUV0WZ8d8v5ozh4ZdwvBOb"


[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = "sk-kimi-uVbo2OFv14bWYQsFgZveTNq40l8r83HpoTgZyH9z5AUUV0WZ8d8v5ozh4ZdwvBOb"


[[plugins]]
path = "/data/data/com.termux/files/home/kimi-code/plugins/official/kimi-datasource"

[[plugins]]
path = "/data/data/com.termux/files/home/kimi-code/plugins/curated/superpowers"

[mcp_servers.filesystem]
command = "npx"
args = [ "-y", "@modelcontextprotocol/server-filesystem", "/data/data/com.termux/files/home" ]

[mcp_servers.git]
command = "uvx"
